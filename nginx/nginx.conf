events {
    worker_connections 1024;
}

http {
    upstream fastapi_backend {
        server fastapi-service:8000;
    }

    upstream flask_backend {
        server flask-service:8000;
    }

    server {
        listen 80;

        # Single public entrypoint that routes to whichever backend the
        # caller wants — the same request/response contract either way,
        # since both services implement the identical API in common/search_engine.py.

        location /api/fast/ {
            proxy_pass http://fastapi_backend/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /api/flask/ {
            proxy_pass http://flask_backend/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /health {
            proxy_pass http://fastapi_backend/health;
        }

        location / {
            return 200 'Job Fit Matcher gateway. Try /api/fast/health, /api/flask/health, /api/fast/match, /api/flask/match\n';
            add_header Content-Type text/plain;
        }
    }
}
